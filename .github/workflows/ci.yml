name: CI - Credit Risk Model Training

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Check Env
        run: |
          python --version
          pip --version
          docker --version

      - name: Install dependencies
        run: |
          pip install mlflow==2.12.1 dagshub==0.3.36 scikit-learn==1.4.2 pandas==2.2.2 numpy==1.26.4 matplotlib==3.8.4 seaborn==0.13.2

      - name: Run mlflow project
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_USERNAME: "231130651"
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_URI: https://dagshub.com/231130651/Eksperimen_SML_Michelle-Anditio.mlflow
        run: |
          cd MLProject
          mlflow run . --env-manager=local

      - name: Get latest MLflow run_id
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/231130651/Eksperimen_SML_Michelle-Anditio.mlflow
          MLFLOW_TRACKING_USERNAME: "231130651"
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          echo "RUN_ID=$(cat MLProject/run_id.txt)" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: |
          pip install requests

      - name: Upload to GitHub
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add -f MLProject/confusion_matrix.png MLProject/feature_importance.png || true
          git commit -m "Add training artifacts [skip ci]" || true
          git push

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Model
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/231130651/Eksperimen_SML_Michelle-Anditio.mlflow
          MLFLOW_TRACKING_USERNAME: "231130651"
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          mlflow models build-docker \
            --model-uri "runs:/$(cat MLProject/run_id.txt)/random_forest_model" \
            --name "credit-risk-model" \
            --env-manager local

      - name: Tag Docker Image
        run: |
          docker tag credit-risk-model ${{ secrets.DOCKERHUB_USERNAME }}/credit-risk-model:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/credit-risk-model:latest
```
